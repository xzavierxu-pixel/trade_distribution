baseline:
  artifact_dir: execution_engine/deploy/early_trade_label_v1
  manifest_file: artifact_manifest.json

runtime:
  mode: paper
  audit_log: artifacts/logs/execution_engine/live.jsonl
  summary_dir: artifacts/logs/execution_engine/summaries
  idempotency_store_path: artifacts/state/execution_engine/idempotency.json

features:
  source: validation_snapshot
  path: null
  feature_window_seconds: 120
  source_is_sell_only: false

thresholds:
  t_up: 0.51
  t_down: 0.49

orders:
  enabled: false
  planner: best_bid_ladder
  kelly_fallback_enabled: false
  best_bid_ladder_max_price: 0.80
  best_bid_ladder_second_offset: 0.10
  best_bid_ladder_shares: 5.0
  fractional_kelly: 0.25
  min_alpha_margin: 0.02
  min_q_margin: 0.02
  min_f_kelly: 0.005
  max_total_budget_usdc: 10.0
  max_order_budget_usdc: 4.0
  min_shares: 5.0
  max_orders_per_window: 3
  maker_only: true
  tick_size: 0.01
  min_price: 0.01
  max_price: 0.99
  max_limit_price: 0.80
  min_market_count: 20
  allowed_fallback_levels:
    - level_0
    - level_1

polymarket:
  host: https://clob.polymarket.com
  gamma_base_url: https://gamma-api.polymarket.com
  data_api_url: https://data-api.polymarket.com
  chain_id: 137
  signature_type: 1
  private_key_env: POLYMARKET_PRIVATE_KEY
  api_key_env: CLOB_API_KEY
  api_secret_env: CLOB_SECRET
  api_passphrase_env: CLOB_PASS_PHRASE
  funder_env: POLYMARKET_FUNDER
